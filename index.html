<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Косынка 2048</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#477b5e">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text" data-i18n="loading">Загрузка...</div>
    </div>
  </div>

  <div id="game-container" style="display: none;">
    <div class="top-panel">
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-label" data-i18n="score">Счёт</span>
          <span id="score-value" class="stat-value">0</span>
        </div>
      </div>
      <div class="buttons-row">
        <button id="btn-new-game" class="action-btn" data-i18n="new_game_btn">Новая игра</button>
        <button id="btn-undo" class="action-btn" data-i18n="undo">Отмена</button>
        <button id="btn-hint" class="action-btn" data-i18n="hint">Подсказка</button>
        <button id="replace-card-btn" class="action-btn" data-i18n="replace_card">Заменить</button>
      </div>

      <div class="cards-preview">
        <div class="preview-card-wrapper">
          <span class="preview-label" data-i18n="current">Текущая</span>
          <div id="current-card-preview" class="card playing-card card-preview">
            <div class="card-corner top-left"><span class="corner-value">2</span><span class="corner-suit"></span></div>
            <div class="card-center-watermark"></div>
            <div class="card-center-num">2</div>
            <div class="card-corner bottom-right"><span class="corner-value">2</span><span class="corner-suit"></span></div>
          </div>
        </div>
        <div class="preview-card-wrapper">
          <span class="preview-label" data-i18n="next">Следующая</span>
          <div id="next-card-preview" class="card playing-card card-preview">
            <div class="card-corner top-left"><span class="corner-value">2</span><span class="corner-suit"></span></div>
            <div class="card-center-watermark"></div>
            <div class="card-center-num">2</div>
            <div class="card-corner bottom-right"><span class="corner-value">2</span><span class="corner-suit"></span></div>
          </div>
        </div>
      </div>

      <div class="houses-row">
        <button class="house-btn" data-house="128">
          <span class="house-rank">J</span>
          <div class="house-slot"><span class="house-placeholder">J</span></div>
          <span class="house-value-sub">128</span>
        </button>
        <button class="house-btn" data-house="256">
          <span class="house-rank">Q</span>
          <div class="house-slot"><span class="house-placeholder">Q</span></div>
          <span class="house-value-sub">256</span>
        </button>
        <button class="house-btn" data-house="512">
          <span class="house-rank">K</span>
          <div class="house-slot"><span class="house-placeholder">K</span></div>
          <span class="house-value-sub">512</span>
        </button>
        <button class="house-btn" data-house="1024">
          <span class="house-rank">A</span>
          <div class="house-slot"><span class="house-placeholder">A</span></div>
          <span class="house-value-sub">1024</span>
        </button>
      </div>
    </div>

    <div class="columns-container" id="columns-container"></div>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div id="modal-window" class="modal-window">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-message" class="modal-message"></div>
      <div id="modal-buttons" class="modal-buttons"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
